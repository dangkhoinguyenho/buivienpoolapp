<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Pool Hall</title><style>/* Pool Hall – flat, calm POS style.
   Colour rules: blue = playing / primary action, amber = paused, red = problem / destructive, white = free.
   Green / blue / purple appear only on the three payment buttons. Everything else is neutral grey. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#f7f8fa; --line:#e2e5e9; --line2:#cfd4da;
  --text:#14181f; --muted:#68717d; --faint:#9aa2ad;
  --blue:#0b63e5; --blue2:#0852c2; --blue-soft:#e8f0fd;
  --amber:#f2a50c; --amber-soft:#fff5df; --red:#d4322c; --red-soft:#fdecec;
  --cash:#12805c; --card:#0b63e5; --zelle:#6b46d6;
  --felt:var(--blue); --felt2:var(--blue2); --green:var(--cash);
  --radius:10px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15.5px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
.icn{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.icn svg{width:100%;height:100%}
button{cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:var(--radius);padding:10px 14px;min-height:44px;font-weight:600;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{background:var(--surface2)}
button:disabled{opacity:.4;pointer-events:none}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:active{background:var(--blue2)}
button.danger{background:var(--surface);border-color:#f0c4c2;color:var(--red)}
button.warn{background:var(--amber-soft);border-color:#f3d48f;color:#8a5a00}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.big{min-height:58px;font-size:18px}
button.sel{background:var(--text);border-color:var(--text);color:#fff}
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius);padding:10px 12px;min-height:44px;width:100%;outline:none;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,99,229,.12)}
input[type=checkbox]{accent-color:var(--blue)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px;letter-spacing:.01em}
h2,h3{letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.num{font-variant-numeric:tabular-nums}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 14px 8px;background:var(--blue);color:#fff}
.topbar h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar button{min-height:38px;padding:7px 12px;font-size:14px;background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.topbar button:active{background:rgba(255,255,255,.12)}
.topbar button.ghost{border-color:transparent;color:rgba(255,255,255,.85)}
.topbar .dot{color:rgba(255,255,255,.8)}
@media (max-width:600px){.topbar{flex-wrap:wrap}.topbar h1{flex-basis:100%;order:-2}.topbar .dot{order:-1;flex-basis:100%}.topbar button{flex:1;padding:7px 6px;font-size:13px}}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#b8c0ca}
.dot.ok::before{background:#34c759}.dot.off::before{background:var(--amber)}
.chips{display:flex;gap:4px;overflow-x:auto;padding:10px 14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:8px;padding:7px 13px;min-height:36px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chip.sel{background:var(--text);border-color:var(--text);color:#fff}
#chips{gap:0;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
#chips .chip{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;min-height:46px;padding:0 14px}
#chips .chip.sel{color:var(--blue);border-bottom-color:var(--blue);background:transparent}
.section-title{padding:16px 16px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:10px 14px 6px}
@media (max-width:480px){.grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 10px}.tcard{min-height:100px;padding:9px}.tcard .tname{font-size:26px}.tcard .ttime{font-size:15px}.tcard .tamt{font-size:13px}.tcard .badge{top:7px;right:7px;font-size:10.5px}}
.tcard{position:relative;border-radius:12px;padding:12px;min-height:116px;background:var(--surface);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;font-weight:400}
.tcard .tname{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.tcard .ttype{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:2px}
.tcard .ttime{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tcard .tamt{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.9}
.tcard .tfree{color:var(--faint);font-size:13px;font-weight:500}
.tcard .badge{position:absolute;top:10px;right:10px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.22);display:inline-flex;gap:3px;align-items:center}
.tcard.busy{background:var(--blue);border-color:var(--blue);color:#fff}
.tcard.paused{background:var(--amber);border-color:var(--amber);color:#2b1d00}
.tcard.busy .ttype,.tcard.paused .ttype{color:inherit;opacity:.75}
.tcard.paused .badge{background:rgba(0,0,0,.08)}
.tcard.over{box-shadow:0 0 0 3px var(--red)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,24,31,.32);display:flex;justify-content:flex-end}
.panel{width:min(560px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(20,24,31,.12);animation:slide .16s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.7}}
.panel-h{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 14px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:19px;font-weight:700;flex:1}
.panel-b{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.panel-f{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--surface)}
.xbtn{width:44px;padding:0;background:transparent;border:0;color:var(--muted)}
.xbtn .icn{width:22px;height:22px}
.bigtime{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.line.total{font-size:22px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(20,24,31,.4);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:14px;padding:20px;width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:0 18px 48px rgba(20,24,31,.22)}
.modal h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:100;background:var(--text);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;font-size:14.5px;box-shadow:0 8px 24px rgba(20,24,31,.25);max-width:90vw}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.trow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.ilist{border-top:1px solid var(--line);margin-top:10px}
.ilist .irow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:40px;min-height:40px;padding:0;font-size:20px}
.qty span{min-width:26px;text-align:center;font-weight:700}
.btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border:0;min-height:44px;color:var(--muted)}
.seg button.sel{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(20,24,31,.14)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t .right{text-align:right}
table.t th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
table.t tr.click{cursor:pointer}table.t tr.click:hover{background:var(--surface2)}
table.t tr.void td{color:var(--faint);text-decoration:line-through}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.cash{color:var(--cash);background:#e9f6f1}.tag.card{color:var(--card);background:var(--blue-soft)}.tag.zelle{color:var(--zelle);background:#f0ecfc}.tag.split{color:var(--text)}
.tag.void,.tag.cancelled{color:var(--red);background:var(--red-soft)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
#print{display:none}
@media print{
  body *{visibility:hidden!important}
  #print,#print *{visibility:visible!important}
  #print{display:block!important;position:absolute;left:0;top:0;width:72mm;color:#000;background:#fff;font:12px/1.35 Menlo,Consolas,monospace}
  @page{margin:4mm}
}
.rcpt{font:13px/1.45 Menlo,Consolas,monospace;background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:14px;max-width:340px;margin:0 auto}
.rcpt .c{text-align:center}.rcpt .b{font-weight:700}.rcpt .l{display:flex;justify-content:space-between;gap:8px}
.rcpt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.mgr{display:block}
#nav{background:var(--surface);border-bottom:1px solid var(--line);padding-bottom:10px}
@media (min-width:1000px){
  .mgr{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 54px)}
  .mgr #nav{flex-direction:column;align-items:stretch;padding:12px;gap:2px;background:var(--surface);border-right:1px solid var(--line);border-bottom:0}
  .mgr #nav .chip{text-align:left;justify-content:flex-start;border-radius:8px;padding:11px 12px;border:0;background:transparent;font-size:14.5px;min-height:auto;color:var(--muted)}
  .mgr #nav .chip.sel{background:var(--blue-soft);color:var(--blue)}
  .mgr #view{padding:10px 28px 60px!important;max-width:1100px!important}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.feed .ev{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.bell{position:relative}
.bell .n{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.panel.wide{width:min(1060px,100%)}
.tscreen{display:grid;grid-template-columns:1fr;grid-template-areas:'st' 'it' 'bl';gap:16px;align-content:start}
.tscreen .a-st{grid-area:st}.tscreen .a-it{grid-area:it}.tscreen .a-bl{grid-area:bl}
@media (min-width:760px){.tscreen{grid-template-columns:minmax(300px,42%) 1fr;grid-template-areas:'st it' 'bl it';grid-template-rows:auto 1fr;column-gap:24px}}
.status{border-radius:12px;padding:14px 16px;background:var(--blue);color:#fff}
.status.paused{background:var(--amber);color:#2b1d00}
.status.none{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.status .clock{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.01em}
.status .lbl{font-size:13.5px;opacity:.85}
.status.tap{cursor:pointer}.status.tap:active{filter:brightness(.95)}
.billl{border-top:1px solid var(--line)}
.bl{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.bl:active{background:var(--surface2)}
.bl .ic{width:22px;display:flex;justify-content:center;color:var(--faint);flex:none}
.bl .ic .icn{width:20px;height:20px}
.bl.timer .ic{color:var(--blue)}.bl.timer.p .ic{color:var(--amber)}.bl.timer.s .ic{color:var(--faint)}
.bl .nt{font-size:13px;color:var(--muted)}
.isec h4{margin:2px 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ibig{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
@media (max-width:420px){.ibig{gap:6px}}
.ibig button{min-height:80px;font-size:22px;font-weight:700;border-radius:10px;border:1px solid var(--line2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px;letter-spacing:-.01em}
.ibig button .s{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.ibig button:active{background:var(--text);border-color:var(--text);color:#fff}
.ibig button:active .s{color:rgba(255,255,255,.7)}
.cart{background:var(--amber-soft);border:1px solid #f3d48f;border-radius:10px;padding:10px 12px;margin-bottom:16px}
.cart .cr{display:flex;align-items:center;gap:8px;padding:6px 0}
.addtimer{width:100%;min-height:58px;font-size:16.5px;border:1px solid var(--line2);background:var(--surface);color:var(--blue);margin-bottom:16px}
.bar{display:flex;gap:8px}
.bar button{flex:1;min-height:56px;font-size:16px}
.bar .co{flex:1.6;font-size:18px}
.paybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paybtns button{min-height:92px;font-size:22px;font-weight:700;border-width:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.paybtns button .icn{width:30px;height:30px}
.paybtns button[data-m=cash]{color:var(--cash)}.paybtns button[data-m=card]{color:var(--card)}.paybtns button[data-m=zelle]{color:var(--zelle)}
.paybtns button[data-m=cash].sel{background:var(--cash);border-color:var(--cash);color:#fff}
.paybtns button[data-m=card].sel{background:var(--card);border-color:var(--card);color:#fff}
.paybtns button[data-m=zelle].sel{background:var(--zelle);border-color:var(--zelle);color:#fff}
.wheel{position:relative;display:flex;justify-content:center;gap:0;height:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none}
.wheel .wcol{height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;width:64px;-webkit-overflow-scrolling:touch;position:relative;z-index:2;overscroll-behavior:contain}
.wheel .wcol::-webkit-scrollbar{display:none}
.wheel .wi{height:40px;line-height:40px;text-align:center;font-size:23px;font-weight:500;scroll-snap-align:center;color:#3a4350;font-variant-numeric:tabular-nums;transform-origin:center;will-change:transform,opacity}
.wheel .wi.on{color:#000;font-weight:600}
.wheel .whl{position:absolute;left:8px;right:8px;top:80px;height:40px;background:rgba(118,118,128,.12);border-radius:9px;z-index:1}
.wheel::before,.wheel::after{content:"";position:absolute;left:0;right:0;height:70px;z-index:3;pointer-events:none}
.wheel::before{top:0;background:linear-gradient(#fff,rgba(255,255,255,0))}.wheel::after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff)}
.tp-native{font-size:24px;text-align:center;min-height:56px;font-weight:600}
.tedit2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.tedit2{grid-template-columns:1fr 1fr}}
.installbar{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:40;background:var(--text);color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(20,24,31,.25)}

.tcard.counter{grid-column:span 2;min-height:96px}
@media (max-width:480px){.tcard.counter{grid-column:1/-1}}

.login{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login-box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px}
.login-box h1{margin:4px 0 6px;font-size:26px}

.wrap{max-width:420px;margin:12vh auto;padding:20px;text-align:center} a.big{display:block;margin:14px 0;padding:26px;border-radius:16px;color:#fff;text-decoration:none;font-size:22px;font-weight:800}</style></head>
