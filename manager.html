<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pool Manager"><meta name="theme-color" content="#0d1714">
<link rel="manifest" href="manifest-manager.json"><link rel="apple-touch-icon" href="icon-manager.png"><link rel="icon" href="icon-manager.png">
<title>Pool Manager</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"><style>/* Pool Hall – flat, calm POS style.
   Colour rules: blue = playing / primary action, amber = paused, red = problem / destructive, white = free.
   Green / blue / purple appear only on the three payment buttons. Everything else is neutral grey. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#f7f8fa; --line:#e2e5e9; --line2:#cfd4da;
  --text:#14181f; --muted:#68717d; --faint:#9aa2ad;
  --blue:#0b63e5; --blue2:#0852c2; --blue-soft:#e8f0fd;
  --amber:#f2a50c; --amber-soft:#fff5df; --red:#d4322c; --red-soft:#fdecec;
  --cash:#12805c; --card:#0b63e5; --zelle:#6b46d6;
  --felt:var(--blue); --felt2:var(--blue2); --green:var(--cash);
  --radius:10px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15.5px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
.icn{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.icn svg{width:100%;height:100%}
button{cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:var(--radius);padding:10px 14px;min-height:44px;font-weight:600;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{background:var(--surface2)}
button:disabled{opacity:.4;pointer-events:none}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:active{background:var(--blue2)}
button.danger{background:var(--surface);border-color:#f0c4c2;color:var(--red)}
button.warn{background:var(--amber-soft);border-color:#f3d48f;color:#8a5a00}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.big{min-height:58px;font-size:18px}
button.sel{background:var(--text);border-color:var(--text);color:#fff}
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius);padding:10px 12px;min-height:44px;width:100%;outline:none;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,99,229,.12)}
input[type=checkbox]{accent-color:var(--blue)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px;letter-spacing:.01em}
h2,h3{letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.num{font-variant-numeric:tabular-nums}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 14px 8px;background:var(--blue);color:#fff}
.topbar h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar button{min-height:38px;padding:7px 12px;font-size:14px;background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.topbar button:active{background:rgba(255,255,255,.12)}
.topbar button.ghost{border-color:transparent;color:rgba(255,255,255,.85)}
.topbar .dot{color:rgba(255,255,255,.8)}
@media (max-width:600px){.topbar{flex-wrap:wrap}.topbar h1{flex-basis:100%;order:-2}.topbar .dot{order:-1;flex-basis:100%}.topbar button{flex:1;padding:7px 6px;font-size:13px}}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#b8c0ca}
.dot.ok::before{background:#34c759}.dot.off::before{background:var(--amber)}
.chips{display:flex;gap:4px;overflow-x:auto;padding:10px 14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:8px;padding:7px 13px;min-height:36px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chip.sel{background:var(--text);border-color:var(--text);color:#fff}
#chips{gap:0;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
#chips .chip{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;min-height:46px;padding:0 14px}
#chips .chip.sel{color:var(--blue);border-bottom-color:var(--blue);background:transparent}
.section-title{padding:16px 16px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:10px 14px 6px}
@media (max-width:480px){.grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 10px}.tcard{min-height:100px;padding:9px}.tcard .tname{font-size:26px}.tcard .ttime{font-size:15px}.tcard .tamt{font-size:13px}.tcard .badge{top:7px;right:7px;font-size:10.5px}}
.tcard{position:relative;border-radius:12px;padding:12px;min-height:116px;background:var(--surface);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;font-weight:400}
.tcard .tname{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.tcard .ttype{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:2px}
.tcard .ttime{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tcard .tamt{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.9}
.tcard .tfree{color:var(--faint);font-size:13px;font-weight:500}
.tcard .badge{position:absolute;top:10px;right:10px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.22);display:inline-flex;gap:3px;align-items:center}
.tcard.busy{background:var(--blue);border-color:var(--blue);color:#fff}
.tcard.paused{background:var(--amber);border-color:var(--amber);color:#2b1d00}
.tcard.busy .ttype,.tcard.paused .ttype{color:inherit;opacity:.75}
.tcard.paused .badge{background:rgba(0,0,0,.08)}
.tcard.over{box-shadow:0 0 0 3px var(--red)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,24,31,.32);display:flex;justify-content:flex-end}
.panel{width:min(560px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(20,24,31,.12);animation:slide .16s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.7}}
.panel-h{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 14px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:19px;font-weight:700;flex:1}
.panel-b{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.panel-f{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--surface)}
.xbtn{width:44px;padding:0;background:transparent;border:0;color:var(--muted)}
.xbtn .icn{width:22px;height:22px}
.bigtime{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.line.total{font-size:22px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(20,24,31,.4);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:14px;padding:20px;width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:0 18px 48px rgba(20,24,31,.22)}
.modal h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:100;background:var(--text);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;font-size:14.5px;box-shadow:0 8px 24px rgba(20,24,31,.25);max-width:90vw}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.trow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.ilist{border-top:1px solid var(--line);margin-top:10px}
.ilist .irow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:40px;min-height:40px;padding:0;font-size:20px}
.qty span{min-width:26px;text-align:center;font-weight:700}
.btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border:0;min-height:44px;color:var(--muted)}
.seg button.sel{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(20,24,31,.14)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t .right{text-align:right}
table.t th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
table.t tr.click{cursor:pointer}table.t tr.click:hover{background:var(--surface2)}
table.t tr.void td{color:var(--faint);text-decoration:line-through}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.cash{color:var(--cash);background:#e9f6f1}.tag.card{color:var(--card);background:var(--blue-soft)}.tag.zelle{color:var(--zelle);background:#f0ecfc}.tag.split{color:var(--text)}
.tag.void,.tag.cancelled{color:var(--red);background:var(--red-soft)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
#print{display:none}
@media print{
  body *{visibility:hidden!important}
  #print,#print *{visibility:visible!important}
  #print{display:block!important;position:absolute;left:0;top:0;width:72mm;color:#000;background:#fff;font:12px/1.35 Menlo,Consolas,monospace}
  @page{margin:4mm}
}
.rcpt{font:13px/1.45 Menlo,Consolas,monospace;background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:14px;max-width:340px;margin:0 auto}
.rcpt .c{text-align:center}.rcpt .b{font-weight:700}.rcpt .l{display:flex;justify-content:space-between;gap:8px}
.rcpt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.mgr{display:block}
#nav{background:var(--surface);border-bottom:1px solid var(--line);padding-bottom:10px}
@media (min-width:1000px){
  .mgr{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 54px)}
  .mgr #nav{flex-direction:column;align-items:stretch;padding:12px;gap:2px;background:var(--surface);border-right:1px solid var(--line);border-bottom:0}
  .mgr #nav .chip{text-align:left;justify-content:flex-start;border-radius:8px;padding:11px 12px;border:0;background:transparent;font-size:14.5px;min-height:auto;color:var(--muted)}
  .mgr #nav .chip.sel{background:var(--blue-soft);color:var(--blue)}
  .mgr #view{padding:10px 28px 60px!important;max-width:1100px!important}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.feed .ev{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.bell{position:relative}
.bell .n{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.panel.wide{width:min(1060px,100%)}
.tscreen{display:grid;grid-template-columns:1fr;grid-template-areas:'st' 'it' 'bl';gap:16px;align-content:start}
.tscreen .a-st{grid-area:st}.tscreen .a-it{grid-area:it}.tscreen .a-bl{grid-area:bl}
@media (min-width:760px){.tscreen{grid-template-columns:minmax(300px,42%) 1fr;grid-template-areas:'st it' 'bl it';grid-template-rows:auto 1fr;column-gap:24px}}
.status{border-radius:12px;padding:14px 16px;background:var(--blue);color:#fff}
.status.paused{background:var(--amber);color:#2b1d00}
.status.none{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.status .clock{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.01em}
.status .lbl{font-size:13.5px;opacity:.85}
.status.tap{cursor:pointer}.status.tap:active{filter:brightness(.95)}
.billl{border-top:1px solid var(--line)}
.bl{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.bl:active{background:var(--surface2)}
.bl .ic{width:22px;display:flex;justify-content:center;color:var(--faint);flex:none}
.bl .ic .icn{width:20px;height:20px}
.bl.timer .ic{color:var(--blue)}.bl.timer.p .ic{color:var(--amber)}.bl.timer.s .ic{color:var(--faint)}
.bl .nt{font-size:13px;color:var(--muted)}
.isec h4{margin:2px 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ibig{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
@media (max-width:420px){.ibig{gap:6px}}
.ibig button{min-height:80px;font-size:22px;font-weight:700;border-radius:10px;border:1px solid var(--line2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px;letter-spacing:-.01em}
.ibig button .s{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.ibig button:active{background:var(--text);border-color:var(--text);color:#fff}
.ibig button:active .s{color:rgba(255,255,255,.7)}
.cart{background:var(--amber-soft);border:1px solid #f3d48f;border-radius:10px;padding:10px 12px;margin-bottom:16px}
.cart .cr{display:flex;align-items:center;gap:8px;padding:6px 0}
.addtimer{width:100%;min-height:58px;font-size:16.5px;border:1px solid var(--line2);background:var(--surface);color:var(--blue);margin-bottom:16px}
.bar{display:flex;gap:8px}
.bar button{flex:1;min-height:56px;font-size:16px}
.bar .co{flex:1.6;font-size:18px}
.paybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paybtns button{min-height:92px;font-size:22px;font-weight:700;border-width:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.paybtns button .icn{width:30px;height:30px}
.paybtns button[data-m=cash]{color:var(--cash)}.paybtns button[data-m=card]{color:var(--card)}.paybtns button[data-m=zelle]{color:var(--zelle)}
.paybtns button[data-m=cash].sel{background:var(--cash);border-color:var(--cash);color:#fff}
.paybtns button[data-m=card].sel{background:var(--card);border-color:var(--card);color:#fff}
.paybtns button[data-m=zelle].sel{background:var(--zelle);border-color:var(--zelle);color:#fff}
.wheel{position:relative;display:flex;justify-content:center;gap:0;height:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none}
.wheel .wcol{height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;width:64px;-webkit-overflow-scrolling:touch;position:relative;z-index:2;overscroll-behavior:contain}
.wheel .wcol::-webkit-scrollbar{display:none}
.wheel .wi{height:40px;line-height:40px;text-align:center;font-size:23px;font-weight:500;scroll-snap-align:center;color:#3a4350;font-variant-numeric:tabular-nums;transform-origin:center;will-change:transform,opacity}
.wheel .wi.on{color:#000;font-weight:600}
.wheel .whl{position:absolute;left:8px;right:8px;top:80px;height:40px;background:rgba(118,118,128,.12);border-radius:9px;z-index:1}
.wheel::before,.wheel::after{content:"";position:absolute;left:0;right:0;height:70px;z-index:3;pointer-events:none}
.wheel::before{top:0;background:linear-gradient(#fff,rgba(255,255,255,0))}.wheel::after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff)}
.tp-native{font-size:24px;text-align:center;min-height:56px;font-weight:600}
.tedit2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.tedit2{grid-template-columns:1fr 1fr}}
.installbar{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:40;background:var(--text);color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(20,24,31,.25)}

.tcard.counter{grid-column:span 2;min-height:96px}
@media (max-width:480px){.tcard.counter{grid-column:1/-1}}

.login{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login-box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px}
.login-box h1{margin:4px 0 6px;font-size:26px}

<body><div id="app"></div>
<script>'use strict';
/* ===== Shared core: utils, i18n, settings, billing engine, data layer (local + Firebase) ===== */
const APP_VERSION = '1.0.0';
const FIREBASE_VER = '10.12.2';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (n = 10) => { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length]; return s; };
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const toC = d => Math.round((+d || 0) * 100);           // dollars -> cents
const toD = c => Math.round(c) / 100;                    // cents -> dollars
const money = d => (d < 0 ? '-' : '') + '$' + Math.abs(+d || 0).toFixed(2);
const pad = n => String(n).padStart(2, '0');
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const clockStr = ms => { if (ms < 0) ms = 0; const s = Math.floor(ms / 1000); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); };
const hm = min => { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h ${pad(m)}m` : `${m}m`; };
const timeOf = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const dateTimeOf = ts => new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
/* Business day: a bill at 1:30 AM belongs to the previous day if the day starts at 4 AM */
const dayKey = (ts, startHour = 4) => ymd(new Date(ts - (startHour || 0) * 3600e3));

/* ---------- i18n ---------- */
const STR = {
  en: {
    pool: 'Pool', carom: '3 Balls', all: 'All', inUse: 'In use', free: 'Free', paused: 'Paused', start: 'Start timer',
    pause: 'Pause', resume: 'Resume', move: 'Move table', editTime: 'Edit time', limit: 'Time limit', cancelTable: 'Cancel table',

/* ---------- Billing engine ----------

/* ---------- Summary math (used by both apps) ---------- */
function summarize(S, bills) {
  const r = { count: 0, total: 0, cash: 0, card: 0, zelle: 0, time: 0, items: 0, discount: 0, rounding: 0, overrides: 0, minutes: 0, lineAdjust: 0,
    voidCount: 0, voidTotal: 0, cancelCount: 0, cancelMin: 0, byType: {}, byItem: {}, byTable: {}, byHour: Array(24).fill(0) };
  for (const b of bills) {
    if (b.status === 'void') { r.voidCount++; r.voidTotal += b.total || 0; continue; }
    if (b.status === 'cancelled') { r.cancelCount++; r.cancelMin += b.playedMin || 0; continue; }
    r.count++; r.total += b.total;
    const p = b.payments || {}; r.cash += p.cash || 0; r.card += p.card || 0; r.zelle += p.zelle || 0;
    r.time += b.time || 0; r.items += b.itemsTotal || 0; r.discount += b.discount || 0; r.rounding += b.rounding || 0; r.lineAdjust += b.lineAdjust || 0;
    if (b.overridden) r.overrides++;
    r.minutes += b.playedMin || 0;
    const tl = b.timers || (b.time ? [{ type: b.tableType, playedMin: b.playedMin, amount: b.time }] : []);
    for (const x of tl) { const ty = x.type || 'other'; r.byType[ty] = r.byType[ty] || { time: 0, minutes: 0, count: 0 }; r.byType[ty].time += x.amount || 0; r.byType[ty].minutes += x.playedMin || 0; r.byType[ty].count++; }
    if (b.tableId && b.tableId !== '_counter') {
      const tk = b.tableLabel || b.tableId;
      r.byTable[tk] = r.byTable[tk] || { minutes: 0, revenue: 0, count: 0 }; r.byTable[tk].minutes += b.playedMin || 0; r.byTable[tk].revenue += b.total; r.byTable[tk].count++;
    }
    for (const i of b.items || []) { const k = i.name; r.byItem[k] = r.byItem[k] || { qty: 0, revenue: 0 }; r.byItem[k].qty += i.qty; r.byItem[k].revenue += i.line ?? i.qty * i.price; }
    r.byHour[new Date(b.paidAt || b.endAt).getHours()] += b.total;
  }
  for (const k of ['total', 'cash', 'card', 'zelle', 'time', 'items', 'discount', 'rounding', 'voidTotal', 'lineAdjust']) r[k] = Math.round(r[k] * 100) / 100;
  return r;
}

/* ---------- iOS-style time wheel (hours & minutes loop around: …11, 12, 1, 2… / …58, 59, 00, 01…) ---------- */
const WH = 40;
const WCOLS = { h: { n: 12, k: 9, lbl: i => i + 1 }, m: { n: 60, k: 7, lbl: i => pad(i) }, p: { n: 2, k: 1, lbl: i => ['AM', 'PM'][i] } };
function wheelHTML() {
  const pads = '<div class="wi"></div><div class="wi"></div>';
  const col = c => { const { n, k, lbl } = WCOLS[c]; let h = ''; for (let j = 0; j < n * k; j++) h += `<div class="wi">${lbl(j % n)}</div>`; return `<div class="wcol" data-c="${c}">${pads}${h}${pads}</div>`; };
  return `<div class="wheel"><div class="whl"></div>${col('h')}${col('m')}${col('p')}</div>`;
}
const wIdx = c => Math.round(c.scrollTop / WH);
function wheelPut(c, v) { const { n, k } = WCOLS[c.dataset.c]; c.scrollTop = (Math.floor(k / 2) * n + v) * WH; wheelMark(c); }
function wheelSet(root, ts) {
  const d = new Date(ts); const h = d.getHours();
  const val = { h: (h % 12 || 12) - 1, m: d.getMinutes(), p: h >= 12 ? 1 : 0 };
  for (const c of $$('.wcol', root)) wheelPut(c, val[c.dataset.c]);
}
function wheelMark(c) {
  const items = c.children; const pos = c.scrollTop / WH; const i = Math.round(pos);
  if (c._lo != null) for (let k = c._lo; k <= c._hi; k++) if (items[k]) { items[k].style.transform = ''; items[k].style.opacity = ''; items[k].classList.remove('on'); }
  c._lo = Math.max(2, i - 4); c._hi = Math.min(items.length - 3, i + 6);
  for (let k = c._lo; k <= c._hi; k++) { const d = (k - 2) - pos; const el = items[k]; el.style.transform = `perspective(420px) rotateX(${(-d * 21).toFixed(1)}deg) scale(${(1 - Math.min(Math.abs(d), 3) * 0.06).toFixed(3)})`; el.style.opacity = (1 - Math.min(Math.abs(d) * 0.28, 0.85)).toFixed(2); el.classList.toggle('on', k - 2 === i); }
}
function wheelVal(c) { const { n } = WCOLS[c.dataset.c]; return ((wIdx(c) % n) + n) % n; }
function wheelGet(root) { // -> {h (0-23), m}
  const v = {}; for (const c of $$('.wcol', root)) v[c.dataset.c] = wheelVal(c);
  return { h: ((v.h + 1) % 12) + (v.p ? 12 : 0), m: v.m };
}
function wheelWire(root, onChange) {
  for (const c of $$('.wcol', root)) {
    let tmr;
    c.addEventListener('scroll', () => {
      wheelMark(c); clearTimeout(tmr);
      tmr = setTimeout(() => { // recentre into the middle copy so it never runs out
        const { n, k } = WCOLS[c.dataset.c];
        if (k > 1) { const i = wIdx(c); if (i < n * 2 || i >= n * (k - 2)) wheelPut(c, ((i % n) + n) % n); }
        onChange && onChange();
      }, 140);
    });
    c.addEventListener('click', e => { const el = e.target.closest('.wi'); if (!el || !el.textContent) return; const k = [...c.children].indexOf(el) - 2; c.scrollTo({ top: k * WH, behavior: 'smooth' }); });
  }
}

}

/* ---------- Time picker: the real iOS wheel on iPhone/iPad, the look-alike wheel elsewhere ---------- */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function timePickerHTML(k) { return IS_IOS ? `<input type="time" class="tp-native" data-tp="${k}">` : `<div data-tp="${k}">${wheelHTML()}</div>`; }
function timePicker(root, k, ts, onChange) {
  const el = $(`[data-tp="${k}"]`, root);
  if (el.tagName === 'INPUT') {
    el.value = hhmm(ts); el.addEventListener('input', () => onChange && onChange()); el.addEventListener('change', () => onChange && onChange());

  }
  const wh = $('.wheel', el); wheelWire(wh, onChange); requestAnimationFrame(() => wheelSet(wh, ts));

}

/* ---------- Range ---------- */
function rangeDates() {
  const now = Date.now(), today = dayKey(now, S.dayStartHour); const d = new Date(today + 'T12:00:00');
  const add = n => { const x = new Date(d); x.setDate(x.getDate() + n); return ymd(x); };
  switch (RANGE.preset) {
    case 'today': return [today, today];
    case 'yesterday': return [add(-1), add(-1)];
    case 'd7': return [add(-6), today];
    case 'month': return [today.slice(0, 8) + '01', today];
    case 'lastMonth': { const x = new Date(d.getFullYear(), d.getMonth() - 1, 1); const y = new Date(d.getFullYear(), d.getMonth(), 0); return [ymd(x), ymd(y)]; }
    default: return [RANGE.from || today, RANGE.to || today];
  }
}
let subKey = '';
function subBills() {
  const [f, to] = rangeDates(); const k = f + '|' + to;
  if (k === subKey) return; subKey = k;
  if (unB) unB();
  unB = DB.onBills(f, to, b => { BILLS = b; if (TAB === 'reports' || TAB === 'bills') view(); });
}
function rangeBar() {
  const [f, to] = rangeDates();
  return `<div class="chips" style="padding-left:0">${['today', 'yesterday', 'd7', 'month', 'lastMonth', 'custom'].map(p => `<button class="chip ${RANGE.preset === p ? 'sel' : ''}" data-rp="${p}">${esc(p === 'today' ? t('today') : tm(p))}</button>`).join('')}</div>
  ${RANGE.preset === 'custom' ? `<div class="row" style="margin-bottom:8px"><label style="margin:0">${esc(tm('from'))}</label><input type="date" id="rf" value="${f}"><label style="margin:0">${esc(tm('to'))}</label><input type="date" id="rt" value="${to}"></div>` : `<div class="muted small" style="margin-bottom:8px">${f === to ? f : f + ' → ' + to}</div>`}`;
}
function wireRange(v) {
  $$('[data-rp]', v).forEach(b => b.onclick = () => { RANGE.preset = b.dataset.rp; if (b.dataset.rp === 'custom') { const [f, to] = rangeDates(); RANGE.from = RANGE.from || f; RANGE.to = RANGE.to || to; } subBills(); view(); });
  const rf = $('#rf', v), rt = $('#rt', v);
  if (rf) rf.onchange = () => { RANGE.from = rf.value; subBills(); view(); };
  if (rt) rt.onchange = () => { RANGE.to = rt.value; subBills(); view(); };
}

  let tot = 0;
  const cards = busy.map(tb => {
    const s = SESS[tb.id]; const c = computeBill(S, s, now); tot += c.total; const cur = curTimer(s);
    return `<div class="tcard ${sessPaused(s) ? 'paused' : 'busy'}" style="cursor:default"><div><div class="ttype">${esc(tb.type ? typeName(S, tb.type) : '')}</div><div class="tname">${esc(tb.name)}</div>

/* ---------- Notifications: every checkout / cancelled table / cancelled bill ---------- */
function evText(b) {
  const m = b.status === 'void' ? `❌ ${t('voided')}: ${b.tableLabel} ${money(b.total)}${b.voidReason ? ' – ' + b.voidReason : ''}`
    : b.status === 'cancelled' ? `⚠️ ${t('tableCancelled')}: ${b.tableLabel} (${hm(b.playedMin || 0)})`
    : `✅ ${b.tableLabel} ${money(b.total)} · ${t(methodOf(b))}`;
  return m;
}
function beep() { try { const A = window.AudioContext || window.webkitAudioContext; const a = new A(); const o = a.createOscillator(); const g = a.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .15); } catch (e) { } }
function watchEvents() {
  const d = dayKey(Date.now(), S.dayStartHour);
  DB.onBills(d, d, bills => {
    const first = SEEN === null; SEEN = SEEN || {};
    for (const b of bills.slice().sort((x, y) => (x.voidAt || x.paidAt) - (y.voidAt || y.paidAt))) {
      const key = b.id + ':' + b.status;
      if (SEEN[key]) continue; SEEN[key] = 1;
      const ev = { at: b.status === 'void' ? b.voidAt : b.paidAt, text: evText(b), status: b.status };
      EVENTS.unshift(ev);
      if (!first) {
        UNREAD++; toast(ev.text); beep();
        try { if (window.Notification && Notification.permission === 'granted') new Notification(S.shopName, { body: ev.text }); } catch (e) { }
      }
    }
    EVENTS = EVENTS.slice(0, 200);
    const n = $('#bell-n'); if (n) { n.textContent = UNREAD; n.classList.toggle('hidden', !UNREAD); }
    if ($('#panel') && $('#panel')._key === 'feed') openFeed();
  });
}

function vMenu(v) {
  const catOpts = sel => S.categories.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(catName(S, c.id))}</option>`).join('');
  let h = `<p class="muted small">${esc(tm('menuHelp'))}</p><h3>${esc(tm('categories'))}</h3><div class="box">${S.categories.map((c, i) => `<div class="row" style="margin:6px 0"><input data-cn="${i}" value="${esc(c.name)}" placeholder="${esc(tm('name'))}"><input data-cv="${i}" value="${esc(c.nameVi || '')}" placeholder="${esc(tm('nameVi'))}"><button class="danger" data-cd="${i}" style="min-width:44px">✕</button></div>`).join('')}
    <button id="addcat">＋ ${esc(tm('addCat'))}</button></div>`;
  for (const c of S.categories) {
    const items = S.items.filter(i => i.cat === c.id);
    h += `<h3>${esc(catName(S, c.id))} <span class="muted small">(${items.length})</span></h3><div class="box">
    ${items.map(i => { const ix = S.items.indexOf(i); return `<div class="row wrap" style="margin:6px 0;${i.active === false ? 'opacity:.5' : ''}"><input class="grow" style="min-width:140px" data-in="${ix}" value="${esc(i.name)}"><input style="width:100px" type="number" inputmode="decimal" step="any" data-ip="${ix}" value="${i.price}"><select style="width:130px" data-ic="${ix}">${catOpts(i.cat)}</select><button data-ia="${ix}" class="${i.active === false ? '' : 'sel'}" style="min-width:90px">${i.active === false ? '○' : '●'} ${esc(tm('active'))}</button><button class="danger" data-id="${ix}" style="min-width:44px">✕</button></div>`; }).join('')}
    <button data-addi="${c.id}">＋ ${esc(tm('addItem'))}</button></div>`;
  }
  v.innerHTML = h;
  $$('[data-cn]', v).forEach(i => i.onchange = () => { S.categories[+i.dataset.cn].name = i.value.trim() || '—'; saveS(); });
  $$('[data-cv]', v).forEach(i => i.onchange = () => { S.categories[+i.dataset.cv].nameVi = i.value.trim(); saveS(); });
  $$('[data-cd]', v).forEach(b => b.onclick = async () => {
    const c = S.categories[+b.dataset.cd]; const n = S.items.filter(i => i.cat === c.id).length;
    if (n) return toast(`${n} ${t('items')} – move or delete them first`);
    if (!await confirmBox(`${tm('confirmDel')} "${c.name}"?`, tm('del'), true)) return;
    S.categories.splice(+b.dataset.cd, 1); saveS(true); view();
  });
  $('#addcat', v).onclick = async () => { const n = await promptBox(tm('addCat'), ''); if (n && n.trim()) { S.categories.push({ id: uid(6), name: n.trim(), nameVi: '' }); saveS(true); view(); } };
  $$('[data-in]', v).forEach(i => i.onchange = () => { S.items[+i.dataset.in].name = i.value.trim() || '—'; saveS(); });
  $$('[data-ip]', v).forEach(i => i.onchange = () => { const p = +i.value; if (isNaN(p) || p < 0) return toast('Invalid price'); S.items[+i.dataset.ip].price = Math.round(p * 100) / 100; saveS(); });
  $$('[data-ic]', v).forEach(i => i.onchange = () => { S.items[+i.dataset.ic].cat = i.value; saveS(true); view(); });
  $$('[data-ia]', v).forEach(b => b.onclick = () => { const it = S.items[+b.dataset.ia]; it.active = it.active === false; saveS(true); view(); });
  $$('[data-id]', v).forEach(b => b.onclick = async () => { const it = S.items[+b.dataset.id]; if (!await confirmBox(`${tm('confirmDel')} "${it.name}"?`, tm('del'), true)) return; S.items.splice(+b.dataset.id, 1); saveS(true); view(); });
  $$('[data-addi]', v).forEach(b => b.onclick = async () => {
    const name = await promptBox(tm('addItem') + ' – ' + tm('name'), ''); if (!name || !name.trim()) return;
    const price = await promptBox(tm('price') + ' ($)', '', 'number'); if (price == null || price === '' || isNaN(+price)) return;
    S.items.push({ id: uid(8), name: name.trim(), price: Math.round(+price * 100) / 100, cat: b.dataset.addi, active: true }); saveS(true); view();
  });
}

/* ---------- Tables & prices ---------- */
function vTables(v) {
  const typeOpts = sel => S.tableTypes.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(typeName(S, x.id))}</option>`).join('');
  let h = `<h3>${esc(tm('types'))}</h3><div class="box">${S.tableTypes.map((x, i) => `<div class="row wrap" style="margin:6px 0"><input class="grow" style="min-width:120px" data-tn="${i}" value="${esc(x.name)}" placeholder="${esc(tm('name'))}"><input class="grow" style="min-width:120px" data-tv="${i}" value="${esc(x.nameVi || '')}" placeholder="${esc(tm('nameVi'))}"><div class="row" style="width:190px"><span>$</span><input type="number" inputmode="decimal" step="any" data-tr="${i}" value="${x.rate}"><span class="muted small">${esc(x.perPerson ? t('perPerson') : t('perHour'))}</span></div><button class="danger" data-td="${i}" style="min-width:44px">✕</button></div>`).join('')}
   <button id="addtype">＋ ${esc(tm('addType'))}</button></div>`;
  h += `<h3>${esc(tm('tablesList'))} <span class="muted small">(${S.tables.length})</span></h3><div class="box">${S.tables.map((x, i) => `<div class="row wrap" style="margin:6px 0">
    <div class="row" style="flex-direction:column;gap:2px"><button data-up="${i}" style="min-height:22px;padding:0 10px;font-size:11px">▲</button><button data-dn="${i}" style="min-height:22px;padding:0 10px;font-size:11px">▼</button></div>
    <input style="width:90px" data-xn="${i}" value="${esc(x.name)}"><select style="width:150px" data-xt="${i}">${typeOpts(x.type)}</select>
    <input style="width:150px" type="number" inputmode="decimal" step="any" data-xr="${i}" value="${x.rate ?? ''}" placeholder="${esc(tm('dflt'))} ${money(typeOf(S, x.type).rate)}">
    ${SESS[x.id] ? `<span class="tag" style="background:var(--blue-soft);color:var(--blue)">${esc(t('inUse'))}</span>` : ''}<span class="grow"></span><button class="danger" data-xd="${i}" style="min-width:44px">✕</button></div>`).join('')}
    <p class="muted small">${esc(tm('rateOverride'))}</p><button id="addtable">＋ ${esc(tm('addTable'))}</button></div>`;
  v.innerHTML = h;
  $$('[data-tn]', v).forEach(i => i.onchange = () => { S.tableTypes[+i.dataset.tn].name = i.value.trim() || '—'; saveS(); });
  $$('[data-tv]', v).forEach(i => i.onchange = () => { S.tableTypes[+i.dataset.tv].nameVi = i.value.trim(); saveS(); });
  $$('[data-tr]', v).forEach(i => i.onchange = () => { const r = +i.value; if (isNaN(r) || r < 0) return toast('Invalid rate'); S.tableTypes[+i.dataset.tr].rate = r; saveS(); view(); });
  $$('[data-td]', v).forEach(b => b.onclick = async () => {
    const ty = S.tableTypes[+b.dataset.td]; const n = S.tables.filter(x => x.type === ty.id).length;
    if (n) return toast(`${n} ${t('table')} – change or delete them first`);
    if (!await confirmBox(`${tm('confirmDel')} "${ty.name}"?`, tm('del'), true)) return; S.tableTypes.splice(+b.dataset.td, 1); saveS(true); view();
  });
  $('#addtype', v).onclick = async () => { const n = await promptBox(tm('addType'), ''); if (!n || !n.trim()) return; const r = await promptBox(tm('rateHr') + ' ($)', '10', 'number'); if (r == null || isNaN(+r)) return; S.tableTypes.push({ id: uid(6), name: n.trim(), nameVi: '', rate: +r }); saveS(true); view(); };
  $$('[data-xn]', v).forEach(i => i.onchange = () => { S.tables[+i.dataset.xn].name = i.value.trim() || '?'; saveS(); });
  $$('[data-xt]', v).forEach(i => i.onchange = () => { S.tables[+i.dataset.xt].type = i.value; saveS(true); view(); });
  $$('[data-xr]', v).forEach(i => i.onchange = () => { const x = S.tables[+i.dataset.xr]; x.rate = i.value === '' ? null : +i.value; saveS(); });
  const swap = (a, b) => { if (b < 0 || b >= S.tables.length) return; [S.tables[a], S.tables[b]] = [S.tables[b], S.tables[a]]; saveS(true); view(); };
  $$('[data-up]', v).forEach(b => b.onclick = () => swap(+b.dataset.up, +b.dataset.up - 1));
  $$('[data-dn]', v).forEach(b => b.onclick = () => swap(+b.dataset.dn, +b.dataset.dn + 1));
  $$('[data-xd]', v).forEach(b => b.onclick = async () => {
    const x = S.tables[+b.dataset.xd]; if (SESS[x.id]) return toast(tm('inUseDel'));
    if (!await confirmBox(`${tm('confirmDel')} ${tableLabel(S, x.id)}?`, tm('del'), true)) return; S.tables.splice(+b.dataset.xd, 1); saveS(true); view();
  });
  $('#addtable', v).onclick = () => {
    const ty = (S.tableTypes[0] || {}).id || 'pool'; const n = S.tables.filter(x => x.type === ty).length + 1;
    S.tables.push({ id: uid(6), name: String(n), type: ty, rate: null }); saveS(true); view();
  };
}

/* ---------- Billing rules ---------- */
let PV = { type: '', min: 37 };
function vBilling(v) {
  const B = S.billing;
  const opt = (val, cur, label) => `<option value="${val}" ${String(val) === String(cur) ? 'selected' : ''}>${esc(label)}</option>`;
  PV.type = PV.type && S.tableTypes.find(x => x.id === PV.type) ? PV.type : (S.tableTypes[0] || {}).id;
  v.innerHTML = `<div class="box">
   <label>${esc(tm('timeRound'))}</label><div class="row"><select id="b-ts">${[0, 1, 5, 10, 15, 30, 60].map(x => opt(x, B.timeStep, x ? x + ' min' : tm('exact'))).join('')}</select>
   <select id="b-tm" ${+B.timeStep ? '' : 'disabled'}>${opt('up', B.timeMode, tm('roundUp'))}${opt('nearest', B.timeMode, tm('roundNear'))}</select></div>
   <label>${esc(tm('extraMin'))}</label><input id="b-ex" type="number" inputmode="numeric" min="0" value="${B.extraMin}"><div class="small muted">${esc(tm('extraHelp'))}</div>
   <label>${esc(tm('minMin'))}</label><input id="b-mn" type="number" inputmode="numeric" min="0" value="${B.minMin}">
   <label>${esc(tm('moneyRound'))}</label><div class="row"><select id="b-ms">${[[0, tm('none')], [0.05, '$0.05'], [0.25, '$0.25'], [0.5, '$0.50'], [1, '$1'], [5, '$5']].map(([x, l]) => opt(x, B.moneyStep, l)).join('')}</select>
   <select id="b-mm" ${+B.moneyStep ? '' : 'disabled'}>${opt('nearest', B.moneyMode, tm('nearest'))}${opt('up', B.moneyMode, tm('up'))}${opt('down', B.moneyMode, tm('down'))}</select></div>
   <label>${esc(tm('applyTo'))}</label><select id="b-ma" ${+B.moneyStep ? '' : 'disabled'}>${opt('total', B.moneyApply, tm('wholeBill'))}${opt('time', B.moneyApply, tm('timeOnly'))}</select></div>
   <h3>${esc(tm('preview'))}</h3><div class="box"><div class="row"><select id="pv-t">${S.tableTypes.map(x => opt(x.id, PV.type, typeName(S, x.id) + ' ' + money(x.rate) + t('perHour'))).join('')}</select><input id="pv-m" type="number" inputmode="numeric" value="${PV.min}" style="width:110px"><span class="muted">min</span></div><div id="pv-out" style="font-size:20px;margin-top:10px"></div></div>
   <h3>${esc(tm('examples'))}</h3><div class="box" style="padding:4px 8px" id="pv-ex"></div>`;
  const calcFor = (type, min) => computeBill(S, { tableId: '_preview', startAt: 1, pausedMs: 0, items: [], rate: typeOf(S, type).rate }, 1 + min * 60000);
  const paint = () => {
    const c = calcFor(PV.type, +PV.min || 0);
    $('#pv-out').innerHTML = `${esc(tm('billedAs'))} <b>${hm(c.billedMin)}</b> → ${money(c.time)}${c.rounding ? ` <span class="muted">(${t('rounding')} ${money(c.rounding)})</span>` : ''} = <b style="color:var(--blue)">${money(c.total)}</b>`;
    const mins = [15, 30, 37, 45, 52, 60, 61, 75, 95, 125];
    $('#pv-ex').innerHTML = `<table class="t"><thead><tr><th>${esc(t('played'))}</th>${S.tableTypes.map(x => `<th class="right">${esc(typeName(S, x.id))}</th>`).join('')}</tr></thead><tbody>${mins.map(m => `<tr><td>${hm(m)}</td>${S.tableTypes.map(x => { const c = calcFor(x.id, m); return `<td class="right num">${money(c.total)} <span class="muted small">${c.billedMin !== m ? '(' + hm(c.billedMin) + ')' : ''}</span></td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
  };
  const set = (k, val) => { B[k] = val; saveS(); vBilling(v); };
  $('#b-ts').onchange = e => set('timeStep', +e.target.value);
  $('#b-tm').onchange = e => set('timeMode', e.target.value);
  $('#b-ex').onchange = e => set('extraMin', Math.max(0, +e.target.value || 0));
  $('#b-mn').onchange = e => set('minMin', Math.max(0, +e.target.value || 0));
  $('#b-ms').onchange = e => set('moneyStep', +e.target.value);
  $('#b-mm').onchange = e => set('moneyMode', e.target.value);
  $('#b-ma').onchange = e => set('moneyApply', e.target.value);
  $('#pv-t').onchange = e => { PV.type = e.target.value; paint(); };
  $('#pv-m').oninput = e => { PV.min = e.target.value; paint(); };
  paint();
}

/* ---------- Store ---------- */
function vStore(v) {
  v.innerHTML = `<div class="box">
   <label>${esc(tm('shopName'))}</label><input id="s-n" value="${esc(S.shopName)}">
   <label>${esc(tm('address'))}</label><input id="s-a" value="${esc(S.address)}">
   <label>${esc(tm('phone'))}</label><input id="s-p" value="${esc(S.phone)}" inputmode="tel">
   <label>${esc(tm('footer'))}</label><input id="s-f" value="${esc(S.receiptFooter)}">
   <label>${esc(tm('dayStart'))}</label><select id="s-d">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(h => `<option value="${h}" ${+S.dayStartHour === h ? 'selected' : ''}>${h === 0 ? '12:00 AM' : h + ':00 AM'}</option>`).join('')}</select><div class="small muted">${esc(tm('dayHelp'))}</div></div>
   <p class="muted small">v${APP_VERSION}</p>`;
  const bind = (id, k) => $(id, v).onchange = e => { S[k] = e.target.value; saveS(); if (k === 'shopName') $('.topbar h1').textContent = S.shopName + ' · ' + tm('title'); };
  bind('#s-n', 'shopName'); bind('#s-a', 'address'); bind('#s-p', 'phone'); bind('#s-f', 'receiptFooter');
  $('#s-d', v).onchange = e => { S.dayStartHour = +e.target.value; saveS(); };
  if (0) $('#s-pin', v).onclick = async () => { const p = await askNewPin(); if (p) { S.managerPin = p.trim(); sessionStorage.setItem('ph_unlock', p.trim()); saveS(true); view(); } };
  const up = null; if (up) up.onclick = () => { S.managerPin = ''; saveS(true); view(); };
}

/* ---------- Sync & backup ---------- */
const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /stores/{storeKey}/{document=**} {
      allow read, write: if storeKey.size() >= 20;
    }
  }
}`;
function vSync(v) {
  const cloud = DB.mode === 'cloud';
  let h = `<div class="box"><div class="line"><span>${esc(tm('status'))}</span><span class="dot ${cloud ? 'ok' : ''}">${esc(cloud ? tm('cloud') : tm('demoMode'))}</span></div>
    ${cloud ? `<div class="line small muted"><span>${esc(tm('signedInAs'))}</span><span>${esc((DB.email || '').split('@')[0])}</span></div>` : ''}</div>`;
  if (cloud) {
    h += `<h3>${esc(tm('regLogin'))}</h3><div class="box"><p class="small muted" style="margin-top:0">${esc(tm('regLoginHelp'))}</p>
      <label>${esc(tm('currentRegPw'))}</label><input id="rp-old" type="password" autocomplete="off">
      <label>${esc(tm('newPw'))}</label><input id="rp-new" type="password" autocomplete="new-password">
      <label>${esc(tm('newPwAgain'))}</label><input id="rp-new2" type="password" autocomplete="new-password">
      <button class="primary" id="rp-go" style="margin-top:12px">${esc(tm('changeRegPw'))}</button></div>
      <h3>${esc(tm('mgrLogin'))}</h3><div class="box">
      <label>${esc(tm('currentPw'))}</label><input id="mp-old" type="password" autocomplete="current-password">
      <label>${esc(tm('newPw'))}</label><input id="mp-new" type="password" autocomplete="new-password">
      <label>${esc(tm('newPwAgain'))}</label><input id="mp-new2" type="password" autocomplete="new-password">
      <div class="row" style="margin-top:12px"><button class="primary" id="mp-go">${esc(tm('changeMgrPw'))}</button><span class="grow"></span><button class="danger" id="m-out">${esc(t('signOut'))}</button></div></div>`;
  }
  h += `<h3>${esc(tm('backup'))}</h3><div class="box row wrap"><button id="exp">⬇ ${esc(tm('exportJson'))}</button><label style="margin:0"><span class="tag" style="padding:12px 14px;font-size:15px;cursor:pointer">⬆ ${esc(tm('importJson'))}</span><input type="file" id="imp" accept=".json,application/json" class="hidden"></label></div>`;
  v.innerHTML = h;
  const pwFlow = async (id, fn, okMsg) => {
    const o = $(`#${id}-old`, v).value, n = $(`#${id}-new`, v).value, n2 = $(`#${id}-new2`, v).value;
    if (n.length < 6) return toast(tm('pwShort')); if (n !== n2) return toast(tm('pinMismatch'));
    const b = $(`#${id}-go`, v); b.disabled = true;
    try { await fn(o, n); toast('✓ ' + okMsg); ['old', 'new', 'new2'].forEach(k => $(`#${id}-${k}`, v).value = ''); }
    catch (e) { const c = String(e && e.code || ''); toast(c.includes('wrong-password') || c.includes('invalid-credential') || c.includes('invalid-login') ? tm('pwWrong') : c.includes('weak') ? tm('pwShort') : 'Error: ' + (e.message || c)); }
    b.disabled = false;
  };
  if (cloud) {
    $('#rp-go', v).onclick = () => pwFlow('rp', changeRegisterPassword, tm('regPwChanged'));
    $('#mp-go', v).onclick = () => pwFlow('mp', changeOwnPassword, tm('saved'));
    $('#m-out', v).onclick = async () => { if (await confirmBox(tm('mgrSignOutConfirm'), t('signOut'), true)) signOutDevice(); };
  }
  $('#exp', v).onclick = async () => { try { const d = await DB.exportAll(); download(`poolhall-backup-${ymd(new Date())}.json`, JSON.stringify(d), 'application/json'); } catch (e) { fail(e); } };
  $('#imp', v).onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); await DB.importAll(d); toast(tm('imported')); } catch (er) { fail(er); } };
}

/* ---------- PIN lock ---------- */
async function askNewPin() {
  const p = await promptBox(tm('newPinTitle'), '', 'password', `<p class="small muted" style="margin-top:0">${esc(tm('newPinHelp'))}</p>`);
  if (p == null) return null;
  if (p.trim().length < 4) { toast(tm('pinShort')); return null; }
  const p2 = await promptBox(tm('pinAgain'), '', 'password'); if (p2 == null) return null;
  if (p2.trim() !== p.trim()) { toast(tm('pinMismatch')); return null; }
  return p.trim();
}
function pinSetupScreen() {
  app.innerHTML = `<div style="max-width:380px;margin:16vh auto;text-align:center;padding:20px"><div style="font-size:50px">🔐</div><h2>${esc(tm('newPinTitle'))}</h2><p class="muted">${esc(tm('newPinHelp'))}</p><button class="primary big" style="width:100%" id="mkpin">${esc(tm('setPin'))}</button></div>`;
  $('#mkpin').onclick = async () => { const p = await askNewPin(); if (!p) return; S.managerPin = p; sessionStorage.setItem('ph_unlock', p); saveS(true); shell(); };
}
function locked() { return S.managerPin && sessionStorage.getItem('ph_unlock') !== S.managerPin; }
function lockScreen() {
  app.innerHTML = `<div style="max-width:320px;margin:18vh auto;text-align:center;padding:20px"><h2>🔒 ${esc(tm('enterPin'))}</h2><input id="pin" type="password" inputmode="numeric" style="text-align:center;font-size:28px;letter-spacing:.3em"><button class="primary big" style="width:100%;margin-top:12px" id="pinok">${esc(t('ok'))}</button></div>`;
  const go = () => { if ($('#pin').value === S.managerPin) { sessionStorage.setItem('ph_unlock', S.managerPin); shell(); } else { toast(tm('wrongPin')); $('#pin').value = ''; } };
  $('#pinok').onclick = go; $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#pin').focus();
}

/* ---------- Boot ---------- */
(async () => {
  registerSW();
  DB = await openDB('manager');
  installHint();
  DB.onStatus(st => { LAST_ST = st; const el = $('#st'); if (el) statusDot(el, st); });
  let first = true;
  DB.onSettings(s => {
    const n = normSettings(s);
    if (!first && stable(n) === stable(S)) return; // our own save echoing back – don't disturb typing
    S = n;
    if (first) { first = false; subBills(); watchEvents(); }
    if (DB.mode === 'cloud' && s === null && !window._phDefSaved && (window._phDefSaved = true)) DB.saveSettings(cleanData(S)).catch(() => { }); // first run: store the default menu & prices
    if (locked()) return lockScreen();
    const ae = document.activeElement, vw = $('#view'); if (vw && ae && ae.matches('input,textarea,select') && vw.contains(ae)) return; // editing – skip remote refresh
    shell();
  });
  DB.onSessions(m => { SESS = {}; for (const [k, x] of Object.entries(m || {})) SESS[k] = normSession(x, S); if (!locked() && (TAB === 'reports' || TAB === 'tables' || TAB === 'live') && !(document.activeElement && document.activeElement.matches('input,select,textarea'))) view(); });
})();
</script>
